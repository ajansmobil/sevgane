  <meta name="description" content="Yunus SEVĞANE - Senior Software Developer. Web, mobil ve yapay zeka alanlarında ölçeklenebilir çözümler geliştiren yazılım geliştirici. 19+ yıl sektör deneyimi, 200+ kurumsal web sitesi, 10+ mobil uygulama. Frontend, backend, DevOps ve yapay zeka geliştirme." />

  <link rel="alternate" hreflang="tr" href="https://sevgane.com/tr/" />
  <link rel="alternate" hreflang="x-default" href="https://sevgane.com/tr/" />
  <script>
(function() {
  var available = ["tr"];
  var fallbackEn = "tr";
  var fallbackTr = "tr";
  var browserLangs = [];
  if (navigator.languages && navigator.languages.length) {
    navigator.languages.forEach(function(l) {
      var code = (l.split('-')[0] || '').toLowerCase();
      if (code && browserLangs.indexOf(code) === -1) browserLangs.push(code);
    });
  }
  if (!browserLangs.length && navigator.language) {
    browserLangs.push((navigator.language.split('-')[0] || 'tr').toLowerCase());
  }
  var chosen = null;
  for (var i = 0; i < browserLangs.length; i++) {
    if (available.indexOf(browserLangs[i]) !== -1) {
      chosen = browserLangs[i];
      break;
    }
  }
  if (chosen === null) {
    chosen = fallbackEn;
  }
  var target = '/' + chosen + '/' + (location.search || '') + (location.hash || '');
  location.replace(target);
})();
  </script>
