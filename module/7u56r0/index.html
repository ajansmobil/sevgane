{{svf}}
<style>
  
  .svf { background: var(--sv-footer-bg, var(--mx-site-surface-2)); color: var(--mx-site-text); font-family: var(--mx-font-sans); padding: 56px 24px 84px; border-top: 1px solid var(--sv-line, color-mix(in srgb, var(--mx-site-text) 14%, transparent)); }
  .svf *, .svf *::before, .svf *::after { box-sizing: border-box; }
  .svf :where(ul) { list-style: none; margin: 0; padding: 0; }
  .svf :where(a) { color: inherit; text-decoration: none; }
  .svf a:focus-visible { outline: 2px solid var(--mx-site-primary); outline-offset: 3px; border-radius: 4px; }
  .svf-inner { max-width: 1240px; margin: 0 auto; }
  .svf-cols { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1.4fr; gap: 40px 48px; text-align: start; }
  .svf-col { min-width: 0; }
  .svf-logo { display: inline-flex; }
  .svf-logo-img { display: block; height: 48px; width: auto; max-width: 220px; }
  .svf-tag { margin: 16px 0 20px; max-width: 34ch; font-size: 15px; line-height: 1.6; color: var(--sv-muted, color-mix(in srgb, var(--mx-site-text) 75%, var(--mx-site-bg))); }
  .svf-social { display: flex; gap: 10px; }
  .svf-social a { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 1px solid var(--sv-line, color-mix(in srgb, currentColor 30%, transparent)); border-radius: 10px; transition: color 0.15s ease-out, border-color 0.15s ease-out, background-color 0.15s ease-out; }
  .svf-social a:hover { color: var(--mx-site-primary); border-color: var(--mx-site-primary); background: color-mix(in srgb, var(--mx-site-primary) 10%, transparent); }
  .svf-social svg { width: 20px; height: 20px; fill: currentColor; }
  .svf .svf-h { margin: 0 0 16px; font-family: var(--mx-font-sans); font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--sv-muted, color-mix(in srgb, var(--mx-site-text) 75%, var(--mx-site-bg))); }
  .svf-links { display: flex; flex-direction: column; gap: 2px; }
  .svf-links a, .svf-contact a { display: inline-flex; align-items: center; min-height: 36px; font-size: 15px; transition: color 0.15s ease-out; }
  .svf-links a:hover, .svf-contact a:hover, .svf-legal a:hover { color: var(--mx-site-primary); text-decoration: underline; text-underline-offset: 3px; }
  .svf-links a[aria-current="page"], .svf-legal a[aria-current="page"] { color: var(--mx-site-primary); font-weight: 600; }
  .svf-contact { display: flex; flex-direction: column; gap: 2px; }
  .svf-contact a { gap: 10px; }
  .svf-ic { display: inline-flex; }
  .svf-ic svg { width: 18px; height: 18px; fill: currentColor; }
  .svf-loc { margin-top: 10px; font-size: 14px; line-height: 1.55; max-width: 32ch; color: var(--sv-muted, color-mix(in srgb, var(--mx-site-text) 75%, var(--mx-site-bg))); }
  .svf-bottom { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; margin-top: 44px; padding-top: 20px; border-top: 1px solid var(--sv-line, color-mix(in srgb, var(--mx-site-text) 14%, transparent)); font-size: 14px; }
  .svf-copy { margin: 0; color: var(--sv-muted, color-mix(in srgb, var(--mx-site-text) 75%, var(--mx-site-bg))); }
  .svf-legal { display: flex; flex-wrap: wrap; gap: 4px 20px; flex: 1 1 auto; }
  .svf-legal a { display: inline-flex; align-items: center; min-height: 32px; }
  .svf-langs { display: flex; gap: 6px; }
  .svf-chip { display: inline-flex; align-items: center; justify-content: center; min-width: 40px; min-height: 36px; padding: 0 10px; border: 1px solid var(--sv-line, color-mix(in srgb, currentColor 30%, transparent)); border-radius: 8px; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; transition: color 0.15s ease-out, border-color 0.15s ease-out; }
  .svf-chip:hover { color: var(--mx-site-primary); border-color: var(--mx-site-primary); }
  .svf-chip[aria-current="true"] { color: var(--mx-site-primary-contrast); border-color: var(--mx-site-primary); background: var(--mx-site-primary); }
  @media (max-width: 960px) { .svf-cols { grid-template-columns: 1fr 1fr; } .svf-brand { grid-column: 1 / -1; } }
  @media (max-width: 600px) {
    .svf { padding: 40px 20px 84px; }
    .svf-cols { grid-template-columns: 1fr; gap: 32px; }
    .svf-bottom { flex-direction: column; align-items: flex-start; margin-top: 32px; }
  }
  
</style>
<script>
  (function () {
    if (window.svCbInit) return;
    window.svCbInit = true;
    var root = document.documentElement;
    function measure() {
      var b = document.querySelector(".cookie-banner[data-mx-cookie]");
      var h = b && !b.hasAttribute("hidden") ? Math.ceil(b.getBoundingClientRect().height) : 0;
      if (h) root.style.setProperty("--mx-cookie-pad", h + 12 + "px"); else root.style.removeProperty("--mx-cookie-pad");
    }
    function bind() {
      var b = document.querySelector(".cookie-banner[data-mx-cookie]");
      if (!b) return;
      if (window.ResizeObserver) new ResizeObserver(measure).observe(b);
      new MutationObserver(measure).observe(b, { attributes: true, attributeFilter: ["hidden", "class", "style"] });
      measure();
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bind); else bind();
    window.addEventListener("resize", measure);
  })();
</script>
