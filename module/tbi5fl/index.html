<section class="sv-ct modulex-ct">
  <h1 class="sv-ct-h1">{{h1}}</h1>
  <p class="sv-ct-lead">{{lead}}</p>
  <div class="sv-ct-grid">
    <form class="sv-ct-form" novalidate data-sv-ct="{&quot;to&quot;:&quot;yunus@sevgane.com&quot;,&quot;subj&quot;:&quot;Web sitesinden mesaj&quot;,&quot;topicLabel&quot;:&quot;Konu&quot;,&quot;nameLabel&quot;:&quot;Ad Soyad&quot;,&quot;emailLabel&quot;:&quot;E-posta&quot;,&quot;orgLabel&quot;:&quot;Kurum&quot;,&quot;msgLabel&quot;:&quot;Mesajınız&quot;,&quot;ok&quot;:&quot;Mesajınız gönderildi, teşekkürler. Genellikle 24 saat içinde dönerim.&quot;,&quot;err&quot;:&quot;Mesaj gönderilemedi. Lütfen doğrudan yazın:&quot;,&quot;errfield&quot;:&quot;Lütfen bu alanı doldurun.&quot;,&quot;erremail&quot;:&quot;Geçerli bir e-posta adresi yazın.&quot;,&quot;errkvkk&quot;:&quot;Devam etmek için onay gerekir.&quot;,&quot;sending&quot;:&quot;Gönderiliyor…&quot;,&quot;rate&quot;:&quot;Çok sık denediniz; biraz sonra yeniden deneyin ya da doğrudan yazın:&quot;,&quot;lang&quot;:&quot;tr&quot;}">
      <h2>Mesaj gönderin</h2>
      <div class="sv-ct-row">
        <label class="sv-ct-f"><span>{{lname}}</span><input type="text" name="name" autocomplete="name" required /><em class="sv-ct-err" role="alert"></em></label>
        <label class="sv-ct-f"><span>{{lemail}}</span><input type="email" name="email" autocomplete="email" required dir="ltr" /><em class="sv-ct-err" role="alert"></em></label>
      </div>
      <div class="sv-ct-row">
        <label class="sv-ct-f"><span>{{lorg}} <small>({{lopt}})</small></span><input type="text" name="org" autocomplete="organization" /></label>
        <label class="sv-ct-f"><span>{{ltopic}}</span><select name="topic">{{options}}</select></label>
      </div>
      <label class="sv-ct-f"><span>Mesajınız</span><textarea name="message" rows="5" required></textarea><em class="sv-ct-err" role="alert"></em></label>
      <label class="sv-ct-k"><input type="checkbox" name="kvkk" required /><span>Kişisel verilerimin yalnızca bu mesajı yanıtlamak için işlenmesini kabul ediyorum. <a href="/tr/kisisel-veriler/">Aydınlatma metni</a></span></label><em class="sv-ct-err sv-ct-err-k" role="alert"></em>
      <div class="sv-ct-hp" aria-hidden="true"><label>Website <input type="text" name="website" tabindex="-1" autocomplete="off" /></label></div>
      <div class="sv-ct-actions">
        <button type="submit" class="sv-ct-btn">{{send}}</button>
        <a class="sv-ct-btn sv-ct-btn-ghost" href="{{wahref}}" target="_blank" rel="noopener noreferrer">{{wa}}</a>
      </div>
      <p class="sv-ct-hint">Mesajınız doğrudan bana ulaşır; genellikle 24 saat içinde dönerim. E-posta adresiniz yalnızca yanıt için kullanılır.</p>
      <p class="sv-ct-status" role="status" aria-live="polite" hidden></p>
    </form>
    <aside class="sv-ct-card" aria-label="{{cardtitle}}">
      <h2>{{cardtitle}}</h2>
      {{card}}
    </aside>
  </div>
  <div class="sv-ct-after">
    <h2>{{aftertitle}}</h2>
    <ol>{{steps}}</ol>
  </div>
</section>
<style>
  .sv-ct-hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
  .sv-ct-btn[disabled]{opacity:.65;cursor:progress}
  .sv-ct{max-width:1100px;margin:0 auto;padding:40px 24px 72px}
  .sv-ct-h1{font-family:var(--mx-font-heading);font-weight:600;font-size:clamp(2rem,4vw,3.1rem);letter-spacing:-.025em;line-height:1.15;text-align:center;margin:8px 0 14px;color:var(--mx-site-text)}
  .sv-ct-lead{font-family:var(--mx-font-heading);font-size:clamp(1.1rem,2vw,1.35rem);line-height:1.55;color:var(--mx-site-text);text-align:center;max-width:46rem;margin:0 auto 28px}
  .sv-ct-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:start}
  .sv-ct-form,.sv-ct-card{background:var(--mx-site-surface);border:1px solid var(--sv-line);border-radius:16px;padding:28px}
  .sv-ct h2{font-family:var(--mx-font-heading);font-size:1.35rem;margin:0 0 18px;color:var(--mx-site-text)}
  .sv-ct-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .sv-ct-f{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;font-size:.92rem;color:var(--mx-site-text)}
  .sv-ct-f span{font-weight:600}.sv-ct-f small{font-weight:400;color:var(--sv-muted)}
  .sv-ct-f input,.sv-ct-f select,.sv-ct-f textarea{width:100%;box-sizing:border-box;font:inherit;font-size:1rem;color:var(--mx-site-text);background:var(--mx-site-bg);border:1px solid var(--sv-chip);border-radius:10px;padding:11px 13px;min-height:44px}
  .sv-ct-f textarea{resize:vertical;min-height:120px}
  .sv-ct-f input:focus-visible,.sv-ct-f select:focus-visible,.sv-ct-f textarea:focus-visible{outline:2px solid var(--mx-site-primary);outline-offset:1px}
  .sv-ct-f[data-bad] input,.sv-ct-f[data-bad] textarea{border-color:#B42318}
  .sv-ct-err{display:none;font-style:normal;font-size:.85rem;color:#B42318}
  .sv-ct-f[data-bad] .sv-ct-err,.sv-ct-err-k[data-bad]{display:block}
  .sv-ct-k{display:flex;align-items:flex-start;gap:10px;font-size:.88rem;line-height:1.5;color:var(--sv-body);margin-bottom:6px}
  .sv-ct-k input{width:20px;height:20px;margin-top:2px;flex:0 0 auto;accent-color:var(--mx-site-primary)}
  .sv-ct-k a{color:var(--mx-site-primary);text-underline-offset:3px}
  .sv-ct-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}
  .sv-ct-btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:8px;border:1px solid var(--mx-site-primary);background:var(--mx-site-primary);color:var(--mx-site-primary-contrast);font:inherit;font-weight:600;text-decoration:none;cursor:pointer;transition:background-color 250ms ease-out,border-color 250ms ease-out}
  .sv-ct-btn:hover{background:color-mix(in srgb,var(--mx-site-primary) 88%,var(--mx-site-text))}
  .sv-ct-btn-ghost{background:transparent;color:var(--mx-site-text);border-color:var(--sv-chip)}
  .sv-ct-btn-ghost:hover{background:color-mix(in srgb,var(--mx-site-primary) 10%,transparent);border-color:var(--mx-site-primary)}
  .sv-ct-hint{margin:14px 0 0;font-size:.85rem;color:var(--sv-muted)}
  .sv-ct-status{margin:14px 0 0;padding:12px 14px;border-radius:10px;border:1px solid var(--sv-line);background:var(--mx-site-surface-2);font-size:.95rem;color:var(--mx-site-text)}
  .sv-ct-status a{color:var(--mx-site-primary)}
  .sv-ct-card ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px}
  .sv-ct-card li{display:flex;gap:12px;align-items:flex-start;color:var(--sv-body);line-height:1.5}
  .sv-ct-card svg{width:22px;height:22px;flex:0 0 auto;margin-top:1px;fill:none;stroke:var(--mx-site-primary);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .sv-ct-card a{color:var(--mx-site-text);text-underline-offset:3px;word-break:break-word}
  .sv-ct-card a:hover{color:var(--mx-site-primary)}
  .sv-ct-after{margin-top:40px}
  .sv-ct-after ol{list-style:none;counter-reset:sv;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .sv-ct-after li{counter-increment:sv;position:relative;background:var(--mx-site-surface);border:1px solid var(--sv-line);border-radius:14px;padding:18px 18px 18px 56px;display:flex;flex-direction:column;gap:4px}
  .sv-ct-after li::before{content:counter(sv);position:absolute;inset-inline-start:16px;top:16px;width:28px;height:28px;border-radius:50%;background:var(--mx-site-primary);color:var(--mx-site-primary-contrast);display:grid;place-items:center;font-weight:700;font-size:.9rem}
  .sv-ct-after strong{color:var(--mx-site-text)}.sv-ct-after span{color:var(--sv-body);font-size:.95rem;line-height:1.5}
  @media (max-width:860px){.sv-ct-grid{grid-template-columns:1fr}.sv-ct-after ol{grid-template-columns:1fr}.sv-ct-row{grid-template-columns:1fr}.sv-ct-form,.sv-ct-card{padding:20px}}
</style>
<script>
(function () {
  var f = document.querySelector(".sv-ct-form");
  if (!f || f.getAttribute("data-sv-ready")) return;
  f.setAttribute("data-sv-ready", "1");
  var D = {}, t0 = Date.now();
  try { D = JSON.parse(f.getAttribute("data-sv-ct") || "{}"); } catch (e) {}
  function bad(el, msg) { var w = el.closest(".sv-ct-f"); if (w) { w.setAttribute("data-bad", "1"); var e = w.querySelector(".sv-ct-err"); if (e) e.textContent = msg; } }
  function clear() { var ws = f.querySelectorAll("[data-bad]"); for (var i = 0; i < ws.length; i++) ws[i].removeAttribute("data-bad"); }
  f.addEventListener("submit", function (ev) {
    ev.preventDefault(); clear();
    var el = f.elements, okForm = true, first = null;
    function fail(x, m) { bad(x, m); okForm = false; if (!first) first = x; }
    if (!el.name.value.trim()) fail(el.name, D.errfield);
    if (!el.email.value.trim()) fail(el.email, D.errfield); else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(el.email.value.trim())) fail(el.email, D.erremail);
    if (!el.message.value.trim()) fail(el.message, D.errfield);
    var ek = f.querySelector(".sv-ct-err-k");
    if (!el.kvkk.checked) { ek.textContent = D.errkvkk; ek.setAttribute("data-bad", "1"); okForm = false; if (!first) first = el.kvkk; }
    var st = f.querySelector(".sv-ct-status");
    if (!okForm) { st.hidden = true; if (first && first.focus) first.focus(); return; }
    var btn = f.querySelector(".sv-ct-btn[type=submit]");
    var link = '<a href="mailto:' + D.to + '">' + D.to + "</a>";
    function say(msg, bad) { st.innerHTML = msg; st.hidden = false; st.setAttribute("data-bad", bad ? "1" : ""); }
    if (btn) { btn.disabled = true; btn.setAttribute("aria-busy", "true"); }
    say(D.sending, false);
    var payload = { name: el.name.value.trim(), email: el.email.value.trim(), org: el.org.value.trim(), topic: el.topic.value, message: el.message.value.trim(), kvkk: true, website: el.website ? el.website.value : "", t: Date.now() - t0, lang: D.lang, page: location.pathname };
    var ctl = window.AbortController ? new AbortController() : null;
    var to = setTimeout(function () { if (ctl) ctl.abort(); }, 20000);
    fetch("/api/iletisim", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(payload), signal: ctl ? ctl.signal : undefined })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { s: r.status, j: j }; }); })
      .then(function (x) {
        if (x.j && x.j.ok) { say(D.ok, false); f.reset(); t0 = Date.now(); }
        else say((x.s === 429 ? D.rate : D.err) + " " + link, true);
      })
      .catch(function () { say(D.err + " " + link, true); })
      .then(function () { clearTimeout(to); if (btn) { btn.disabled = false; btn.removeAttribute("aria-busy"); } });
  });
})();
</script>
